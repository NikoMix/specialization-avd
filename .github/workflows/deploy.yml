name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Hugo *extended* is required: the ms-hugo-theme stylesheet is Sass.
  HUGO_VERSION: 0.165.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The remote template github.com/NikoMix/ms-hugo-theme is pinned as a
          # submodule at themes/ms-hugo-theme. It cannot be consumed as a Hugo
          # Module: Go's module packer strips directories named `vendor`, which
          # drops the theme's assets/scss/vendor/_chroma.scss and fails the Sass
          # build with "File to import not found or unreadable: vendor/chroma".
          submodules: recursive
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify every Markdown table rendered as a table
        # Audit control pages are evidence checklists in table form. This gate
        # fails the build if any table degrades into a code block or paragraph.
        run: python3 scripts/verify-tables.py

      - name: Verify every internal link resolves
        # The theme only warns about broken *relative* links, and this site
        # links with absolute paths, so nothing upstream catches a link that
        # drops the Pages sub-path.
        run: python3 scripts/verify-links.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
