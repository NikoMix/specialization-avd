name: Create Audit Engagement Issues

# Creates one GitHub issue per requirement of the audit guide, for the current
# audit cycle. Issue bodies are generated from the guide itself — the
# `## Required Evidence Checklist` table on every Module A / Module B control
# page — so the docs and the issues cannot drift apart.
#
# Re-running is safe: any issue title that already carries this cycle's label
# is skipped, so the workflow only creates what does not already exist.

on:
  workflow_dispatch:
    inputs:
      granularity:
        description: >-
          control = one issue per control with every requirement as a checkbox.
          requirement = the same, plus one issue per individual Module B
          evidence item.
        type: choice
        options: [control, requirement]
        default: control
      cycle_year:
        description: Audit cycle year (defaults to the current year).
        type: string
        default: ''
      dry_run:
        description: Print the issues that would be created without creating them.
        type: boolean
        default: false

  # Scheduled run — fires 9 months after a typical June audit month so partners
  # have 3 months to re-collect evidence before the next annual audit.
  #
  # HOW TO SET YOUR SCHEDULE:
  #   Take your typical audit completion month and add 9 months.
  #   Example: audit finishes in June -> scheduled run fires March 1st the
  #   following year. The default below fires on March 1st at 09:00 UTC.
  schedule:
    - cron: "0 9 1 3 *"

permissions:
  issues: write
  contents: read

jobs:
  create-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine audit cycle
        id: cycle
        run: |
          YEAR="${{ inputs.cycle_year }}"
          [ -n "$YEAR" ] || YEAR=$(date -u +%Y)
          echo "year=$YEAR"            >> "$GITHUB_OUTPUT"
          echo "label=audit-$YEAR"     >> "$GITHUB_OUTPUT"
          echo "milestone=Audit $YEAR" >> "$GITHUB_OUTPUT"

      - name: Create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "pre-qualification" --color "0e8a16" --description "Pre-qualification gate"            --repo "$GITHUB_REPOSITORY" --force
          gh label create "module-a"          --color "e4e669" --description "Module A - Azure Essentials"      --repo "$GITHUB_REPOSITORY" --force
          gh label create "module-b"          --color "d73a4a" --description "Module B - Azure Virtual Desktop" --repo "$GITHUB_REPOSITORY" --force
          gh label create "audit-evidence"    --color "5319e7" --description "Evidence collection task"         --repo "$GITHUB_REPOSITORY" --force
          gh label create "${{ steps.cycle.outputs.label }}" --color "0075ca" \
            --description "Audit cycle ${{ steps.cycle.outputs.year }}" \
            --repo "$GITHUB_REPOSITORY" --force

      - name: Create or find milestone
        id: milestone
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="${{ steps.cycle.outputs.milestone }}"
          DUE="${{ steps.cycle.outputs.year }}-06-30T00:00:00Z"

          NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if [ -z "$NUMBER" ]; then
            echo "Creating milestone '$TITLE'..."
            NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/milestones" \
              --method POST \
              --field title="$TITLE" \
              --field due_on="$DUE" \
              --field description="Azure Virtual Desktop Advanced Specialization - ${{ steps.cycle.outputs.year }} audit cycle" \
              --jq ".number")
          else
            echo "Milestone '$TITLE' already exists (number=$NUMBER)"
          fi

          if [ -z "$NUMBER" ]; then
            echo "::error::Failed to resolve milestone number for '$TITLE'"
            exit 1
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CYCLE_LABEL: ${{ steps.cycle.outputs.label }}
          MILESTONE: ${{ steps.milestone.outputs.title }}
          GRANULARITY: ${{ inputs.granularity || 'control' }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONIOENCODING: utf-8
        run: python3 .github/scripts/create-issues.py
