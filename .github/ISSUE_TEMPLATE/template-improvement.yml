name: Template improvement
description: Propose a change to an engagement playbook template (questionnaire, HLD, LLD, runbook, KT, hypercare, DoD)
title: "[template] <template-name> – <short summary>"
labels: ["innersource", "engagement-playbook", "template"]
body:
  - type: dropdown
    id: template
    attributes:
      label: Template
      options:
        - Offering one-pager
        - Qualification questionnaire
        - Discovery workshop
        - WAF assessment
        - Assessment platform inputs (MAP / RDS-to-AVD)
        - Reference architectures
        - HLD template
        - LLD template
        - Runbook template
        - KT plan template
        - Hypercare plan template
        - Definition of Done
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale (engagement context)
      description: What did you encounter that the current template didn't handle? Anonymise customer details.
    validations:
      required: true
